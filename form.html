<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f2f2f2;
        }

        .main-box {
            width: 700px;
            height: 700px;
            background-color: white;
            border: 3px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative; /* important for positioning logo */
            font-size: 22px;
            font-weight: bold;
        }

        .logo-box {
            width: 120px;
            height: 150px;
            background-color: darkcyan;
            border: 3px solid black;
            position: absolute;
            left: 10px;     
            top: 20px;       
            display: flex;
            justify-content: center;
            align-items: center;
            color: black;
            font-size: 24px;
            font-weight: bold;
        }
        .rect-box {
            width: 300px;
            height: 40px;
            background-color: darkcyan;
            border: 2px solid black;
            position: absolute;
            top: 20px;
            left: 150px;
        }
        .rect-box2 {
            width: 200px;
            height: 40px;

            top: 80px;
            left: 150px;
        }

            width: 60px;
            height: 25px;
            border: 2px solid black;
            position: absolute;
            top: 140px;
            left: 150px;
            background-color: darkcyan;
        }
        .small-box2{
            width: 60px;
            height: 25px;
            border: 2px solid black;
            position: absolute;
            top: 140px;
            left: 230px;
            background-color: darkcyan;
        }
        .small-box3{
            width: 60px;
            height: 25px;
            border: 2px solid black;
            position: absolute;
            top: 140px;
            left: 310px;
            background-color: darkcyan;
        }
        .small-box4{
            width: 60px;
            height: 25px;
            border: 2px solid black;
            position: absolute;
            top: 140px;
            left: 390px;
            background-color: darkcyan;
        }
        .small-box5{
            width: 60px;
            height: 25px;
            border: 2px solid black;
            position: absolute;
            top: 140px;
            left: 470px;
            background-color: darkcyan;
        }
        .small-box6{
            width: 60px;
            height: 25px;
            border: 2px solid black;
            position: absolute;
            top: 140px;
            left: 550px;
            background-color:darkcyan;
        }
        .Navigation{  
            justify-content: center;
            align-items: center;
            color:black;

            text-align: center;
            width: 100px;
            height: 150px;
            border: 3px solid black;
            position: absolute;
            top: 200px;
            left: 10px;
            background-color:rgb(226, 238, 226);
        }
        .Content{
            width: 500px;

            border: 3px solid black;

            top: 200px;

            background-color:aliceblue;
        }
        .footer{
            width: 500px;
            height: 50px;
            background-color: darkcyan;
            color: rgb(23, 32, 40);
            text-align: center;
            position: absolute;
            right : 20px ;
            bottom: 20px;
            border: 2px solid black;
        }
        .white{
            color : black;
            position:absolute;
            bottom: 40px;
            left: 40px;
        }
